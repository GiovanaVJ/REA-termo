
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#705e63">
  <title>TERMO</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="top-left">
      <button class="icon-button" id="new-game" aria-label="Novo jogo">⌃</button>
      <button class="icon-button" id="help" aria-label="Como jogar">?</button>
    </div>

    <h1>TERMO</h1>

    <div class="top-right">
      <button class="icon-button" id="stats" aria-label="Estatísticas">▥</button>
      <button class="icon-button" id="settings" aria-label="Configurações">⚙</button>
    </div>
  </header>

  <main>
    <p id="message" class="message" role="status" aria-live="polite"></p>

    <section id="board" class="board" aria-label="Tabuleiro de palavras"></section>

    <section id="keyboard" class="keyboard" aria-label="Teclado virtual">
      <div class="key-row">
        <button class="key" data-key="Q">Q</button>
        <button class="key" data-key="W">W</button>
        <button class="key" data-key="E">E</button>
        <button class="key" data-key="R">R</button>
        <button class="key" data-key="T">T</button>
        <button class="key" data-key="Y">Y</button>
        <button class="key" data-key="U">U</button>
        <button class="key" data-key="I">I</button>
        <button class="key" data-key="O">O</button>
        <button class="key" data-key="P">P</button>
      </div>

      <div class="key-row middle-row">
        <button class="key" data-key="A">A</button>
        <button class="key" data-key="S">S</button>
        <button class="key" data-key="D">D</button>
        <button class="key" data-key="F">F</button>
        <button class="key" data-key="G">G</button>
        <button class="key" data-key="H">H</button>
        <button class="key" data-key="J">J</button>
        <button class="key" data-key="K">K</button>
        <button class="key" data-key="L">L</button>
        <button class="key key-action" data-key="BACKSPACE" aria-label="Apagar">⌫</button>
      </div>

      <div class="key-row bottom-row">
        <button class="key" data-key="Z">Z</button>
        <button class="key" data-key="X">X</button>
        <button class="key" data-key="C">C</button>
        <button class="key" data-key="V">V</button>
        <button class="key" data-key="B">B</button>
        <button class="key" data-key="N">N</button>
        <button class="key" data-key="M">M</button>
        <button class="key key-enter" data-key="ENTER">ENTER</button>
      </div>
    </section>
  </main>

  <dialog id="modal">
    <div class="modal-content">
      <button id="close-modal" class="close-button" aria-label="Fechar">✕</button>
      <h2 id="modal-title">Como jogar</h2>
      <div id="modal-body"></div>
    </div>
  </dialog>
</body>
</html>
